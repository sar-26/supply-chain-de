<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supply Chain · Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{--bg:#0B0E14;--panel:#131926;--panel2:#0F1420;--line:#212C40;--text:#EAEEF5;--muted:#7E8AA0;--cyan:#34D3EE;--red:#FF5D5D;--amber:#FFB020;--green:#3DD68C;--radius:14px}
  *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .num{font-family:"Space Grotesk";font-variant-numeric:tabular-nums}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;font-weight:600;font-size:16px}.brand .glyph{color:var(--cyan);font-size:20px}
  .nav{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
  .nav a{color:var(--muted);text-decoration:none;font-size:13px;padding:6px 14px;border-radius:7px}.nav a.on{background:var(--cyan);color:#06222a;font-weight:600}.nav a:not(.on):hover{color:var(--text)}
  .live{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.pulse{width:9px;height:9px;border-radius:50%;background:var(--green)}
  .wrap{padding:18px 24px;max-width:1360px;margin:0 auto}
  .crumb{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:16px;flex-wrap:wrap}
  .crumb a{color:var(--cyan);cursor:pointer}.crumb a:hover{text-decoration:underline}.crumb span.sep{color:var(--muted)}.crumb b{font-weight:600}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:16px}
  .kpi{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;height:100%;width:3px;background:var(--cyan)}.kpi.sec::before{background:var(--muted)}
  .kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:23px;font-weight:600;margin-top:7px;line-height:1}
  .grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}@media(max-width:960px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px}
  .p-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px}.p-head h2{font-size:14px;margin:0}
  .sub{color:var(--muted);font-size:12px;margin-bottom:10px}
  .tablewrap{max-height:430px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
  th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-weight:500}th.r,td.r{text-align:right}td.r{font-family:"Space Grotesk";font-variant-numeric:tabular-nums}
  tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}.drill-ic{color:var(--muted);font-size:11px}
  .badge{font-size:11px;padding:2px 9px;border-radius:20px;color:#0B0E14;font-weight:600}
  .badge.Profitable,.badge.green{background:var(--green)}.badge.Balanced,.badge.amber{background:var(--amber)}.badge.Loss,.badge.red{background:var(--red)}.badge.wh{background:var(--cyan)}
  .neg{color:var(--red)}.pos{color:var(--green)}.muted{color:var(--muted)}
  canvas{max-height:230px}
  .ainote{border-left:3px solid var(--cyan);padding:11px 16px;background:var(--panel2);border-radius:0 8px 8px 0}
  .ainote .ah{font-size:14px;font-weight:600;margin-bottom:6px}.ainote ul{margin:6px 0;padding-left:18px}.ainote li{font-size:13px;margin:4px 0;line-height:1.5}.ainote .aact{margin-top:9px;font-size:13px;color:var(--muted)}
</style></head><body>
<div class="topbar">
  <div class="brand"><span class="glyph">⬡</span> Ops Command</div>
  <div class="nav"><a class="on" href="#">Home</a><a href="http://localhost:8000">Cockpit</a><a href="http://localhost:8001">Lists</a></div>
  <div class="live"><span class="pulse"></span><span id="updated">live</span></div>
</div>
<div class="wrap">
  <div class="crumb" id="crumb"></div>
  <div class="kpis" id="kpis"></div>
  <div class="grid">
    <div class="panel">
      <div class="p-head"><h2 id="tblTitle">Profitability by region</h2></div>
      <div class="sub">Net profit = gross profit − logistics (last-mile freight; + warehouse handling at hub). Green profitable · amber balanced · red loss.</div>
      <div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    </div>
    <div class="panel"><div class="p-head"><h2>Revenue &amp; gross profit</h2>
      <div class="nav" id="daySeg" style="background:var(--panel2)"><button data-days="30" class="on">30d</button><button data-days="60">60d</button><button data-days="90">90d</button></div></div>
      <canvas id="trend"></canvas></div>
  </div>
  <div class="panel" id="aiPanel" style="margin-top:14px"></div>
</div>
<script>
const C={cyan:"#34D3EE",green:"#3DD68C",muted:"#7E8AA0",line:"#212C40"};
Chart.defaults.color=C.muted;Chart.defaults.font.family="Inter, sans-serif";Chart.defaults.font.size=12;
const fmt=n=>Number(Math.round(n)).toLocaleString("en-IN"),money=n=>(n<0?"-₹":"₹")+fmt(Math.abs(n));
const j=u=>fetch(u).then(r=>r.json());
const st={level:"all",region:null,key:null,storeName:null,cat:null,days:30};
let trend;
function crumb(){let h=`<a onclick="go('all')">All India</a>`;
  if(st.region)h+=`<span class="sep">›</span>`+(st.level==="region"?`<b>${st.region}</b>`:`<a onclick="go('region',{region:'${st.region}'})">${st.region}</a>`);
  if(st.storeName&&(st.level==="store"||st.level==="cat"))h+=`<span class="sep">›</span>`+(st.level==="store"?`<b>${st.storeName}</b>`:`<a onclick="goStore()">${st.storeName}</a>`);
  if(st.cat&&st.level==="cat")h+=`<span class="sep">›</span><b>${st.cat}</b>`;
  document.getElementById("crumb").innerHTML=h;}
function kpis(t){const gm=t.rev?(t.gp/t.rev*100).toFixed(1):"0.0";
  document.getElementById("kpis").innerHTML=[["Revenue",money(t.rev||0),""],["Gross profit",money(t.gp||0),""],["Gross margin",gm+"%",""],
    ["Logistics cost",money(t.logistics||0),"sec"],["Inbound units",fmt(t.inb||0),"sec"],["Outbound units",fmt(t.outb||0),"sec"]]
    .map(x=>`<div class="kpi ${x[2]}"><div class="l">${x[0]}</div><div class="v num">${x[1]}</div></div>`).join("");}
const thd=c=>document.getElementById("thead").innerHTML="<tr>"+c.map(x=>`<th class="${x.r?'r':''}">${x.t}</th>`).join("")+"</tr>";
const sb=s=>`<span class="badge ${s}">${s}</span>`;
function pnlNoLo(n){return `<td class="r">${money(n.rev)}</td><td class="r">${money(n.gp)}</td><td class="r ${n.net<0?'neg':'pos'}">${money(n.net)}</td><td class="r">${(n.margin*100).toFixed(1)}%</td><td>${sb(n.status)}</td>`}
function pnlLo(n){return `<td class="r">${money(n.rev)}</td><td class="r">${money(n.gp)}</td><td class="r muted">${money(n.logistics)}</td><td class="r ${n.net<0?'neg':'pos'}">${money(n.net)}</td><td class="r">${(n.margin*100).toFixed(1)}%</td><td>${sb(n.status)}</td>`}
async function render(){
  crumb();
  let url;
  if(st.level==="all")url="/api/home/regions";
  else if(st.level==="region")url="/api/home/region/"+encodeURIComponent(st.region);
  else if(st.level==="store")url="/api/home/store/"+encodeURIComponent(st.key);
  else url="/api/home/category?store_id="+encodeURIComponent(st.key)+"&category="+encodeURIComponent(st.cat);
  const data=await j(url);kpis(data.totals||{});
  const tb=document.getElementById("tbody");
  if(st.level==="all"){document.getElementById("tblTitle").textContent="Profitability by region";
    thd([{t:"Region"},{t:"Revenue",r:1},{t:"Gross profit",r:1},{t:"Net profit",r:1},{t:"Margin",r:1},{t:"Status"},{t:"Critical",r:1}]);
    tb.innerHTML=data.rows.map(r=>`<tr class="click" onclick="go('region',{region:'${r.name}'})"><td>${r.name} <span class="drill-ic">›</span></td>${pnlNoLo(r)}<td class="r">${r.crit?`<span class="badge red">${r.crit}</span>`:'0'}</td></tr>`).join("");}
  else if(st.level==="region"){document.getElementById("tblTitle").textContent=st.region+" — warehouse & stores";
    thd([{t:"Node"},{t:"Type"},{t:"Revenue",r:1},{t:"Gross profit",r:1},{t:"Net profit",r:1},{t:"Margin",r:1},{t:"Status"},{t:"Health"}]);
    tb.innerHTML=data.rows.map(r=>{const h=r.rowtype==="WH"?(r.health?`<span class="badge red">${r.health}</span>`:'<span class="badge green">OK</span>'):`<span class="badge ${r.health}">${r.health==="red"?"Critical":r.health==="amber"?"Watch":"OK"}</span>`;
      const cl=r.rowtype==="DS"?`class="click" onclick="goStoreRow('${r.key}','${r.name.replace(/'/g,'')}')"`:'';
      return `<tr ${cl}><td>${r.name} ${r.rowtype==="DS"?'<span class="drill-ic">›</span>':''}</td><td class="muted">${r.rowtype==="WH"?"Warehouse":"Dark store"}</td>${pnlNoLo(r)}<td>${h}</td></tr>`}).join("");}
  else if(st.level==="store"){document.getElementById("tblTitle").textContent=st.storeName+" — profitability by category";
    thd([{t:"Category"},{t:"Revenue",r:1},{t:"Gross profit",r:1},{t:"Logistics",r:1},{t:"Net profit",r:1},{t:"Margin",r:1},{t:"Status"}]);
    tb.innerHTML=data.rows.map(r=>`<tr class="click" onclick="go('cat',{cat:'${r.name.replace(/'/g,'')}'})"><td>${r.name} <span class="drill-ic">›</span></td>${pnlLo(r)}</tr>`).join("");}
  else{document.getElementById("tblTitle").textContent=st.storeName+" · "+st.cat+" — by product";
    thd([{t:"Product"},{t:"Revenue",r:1},{t:"Gross profit",r:1},{t:"Logistics",r:1},{t:"Net profit",r:1},{t:"Margin",r:1},{t:"Status"}]);
    tb.innerHTML=data.rows.map(r=>`<tr>${('<td>'+r.name+'</td>')}${pnlLo(r)}</tr>`).join("");}
  renderAI(data);drawTrend();
  document.getElementById("updated").textContent="Live · "+new Date().toLocaleTimeString();
}
function renderAI(data){const t=data.totals||{},rows=data.rows||[];let head,pts,act;
  const worst=rows.slice().filter(r=>r.margin!==undefined).sort((a,b)=>a.margin-b.margin)[0];
  if(st.level==="all"){head=`National net margin ${(t.margin*100).toFixed(1)}% after logistics — ${worst?worst.name:""} is weakest.`;
    pts=["Freight (last-mile + hub handling) is the main drag on otherwise-healthy gross profit.","Drill the weakest region to find the loss-making stores.","Revenue is solid; margin is the lever."];act="Attack freight on low-value baskets and perishables; open the weakest region.";}
  else if(st.level==="region"){const loss=rows.filter(r=>r.status==="Loss").length;head=`${st.region}: ${(t.margin*100).toFixed(1)}% net margin, ${loss} node(s) in loss.`;
    pts=["The hub's handling opex plus store freight sets the regional floor.",`${worst?worst.name+" is the weakest node.":""}`,"Stock-critical stores add hidden lost sales."];act="Open the weakest store to see which category leaks margin.";}
  else if(st.level==="store"){head=`${st.storeName} is ${t.status?.toLowerCase()} at ${(t.margin*100).toFixed(1)}% net margin.`;
    pts=[`${worst?worst.name+" is the biggest margin drag ("+(worst.margin*100).toFixed(1)+"%).":""}`,"Perishables carry the heaviest freight per rupee.","Small baskets amplify last-mile cost."];act=`Reprice or re-mix ${worst?worst.name:"the worst category"}.`;}
  else{head=`${st.cat} at ${st.storeName}: ${(t.margin*100).toFixed(1)}% net margin (${t.status}).`;
    pts=["A few products drag this category — see the sorted list.","Freight per rupee is high on heavy/perishable items.","Pricing or pack-size tweaks recover the most."];act="Reprice or drop the worst products; bundle to dilute freight.";}
  document.getElementById("aiPanel").innerHTML=`<div class="p-head"><h2>AI analysis</h2><span class="muted" style="font-size:12px">rule-based now · Claude call plugs in here</span></div><div class="ainote"><div class="ah">${head}</div><ul>${pts.filter(Boolean).map(x=>`<li>${x}</li>`).join("")}</ul><div class="aact"><strong>Recommended:</strong> ${act}</div></div>`;}
window.go=(level,p={})=>{if(level==="all"){Object.assign(st,{level:"all",region:null,key:null,storeName:null,cat:null});}
  else if(level==="region"){Object.assign(st,{level:"region",region:p.region,key:null,storeName:null,cat:null});}
  else if(level==="cat"){st.level="cat";st.cat=p.cat;} render();};
window.goStoreRow=(key,name)=>{Object.assign(st,{level:"store",key,storeName:name,cat:null});render();};
window.goStore=()=>{st.level="store";st.cat=null;render();};
function drawTrend(){let u="/api/home/trend?days="+st.days;
  if(st.level==="region")u+="&region="+encodeURIComponent(st.region);
  else if(st.level==="store"||st.level==="cat")u+="&store_id="+encodeURIComponent(st.key);
  j(u).then(t=>{trend.data.labels=t.map(x=>x.day.slice(5));trend.data.datasets[0].data=t.map(x=>x.rev);trend.data.datasets[1].data=t.map(x=>x.gp);trend.update();});}
trend=new Chart(document.getElementById("trend"),{type:"line",data:{labels:[],datasets:[
  {label:"Revenue",data:[],borderColor:C.cyan,backgroundColor:C.cyan+"1A",fill:true,tension:.3,pointRadius:0,borderWidth:2},
  {label:"Gross profit",data:[],borderColor:C.green,fill:false,tension:.3,pointRadius:0,borderWidth:2}]},
  options:{interaction:{mode:"index",intersect:false},scales:{x:{grid:{color:C.line},ticks:{maxTicksLimit:8}},y:{grid:{color:C.line},ticks:{callback:v=>"₹"+(v/1000)+"k"}}},plugins:{legend:{position:"top",align:"end",labels:{boxWidth:10,usePointStyle:true}}}}});
document.getElementById("daySeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;[...e.currentTarget.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");st.days=+b.dataset.days;drawTrend();});
render();
</script></body></html>
