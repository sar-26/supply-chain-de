version: 2

models:
  - name: dim_date
    description: "Conformed calendar dimension with weekend and festival flags."
    columns:
      - name: date_key
        tests: [unique, not_null]

  - name: dim_product
    description: "SCD Type 2 product dimension built on the product snapshot."
    columns:
      - name: product_key
        tests: [unique, not_null]
      - name: product_id
        tests: [not_null]
      - name: is_current
        tests:
          - accepted_values:
              values: ['Y', 'N']

  - name: dim_location
    description: "Conformed location dimension (warehouses, dark stores, suppliers)."
    columns:
      - name: location_key
        tests: [unique, not_null]
      - name: location_id
        tests: [unique, not_null]

  - name: dim_customer
    description: "Customer dimension."
    columns:
      - name: customer_key
        tests: [unique, not_null]
      - name: customer_id
        tests: [unique, not_null]

  - name: dim_supplier
    description: "Supplier dimension."
    columns:
      - name: supplier_key
        tests: [unique, not_null]
      - name: supplier_id
        tests: [unique, not_null]
