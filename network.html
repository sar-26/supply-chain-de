  *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .num{font-family:"Space Grotesk";font-variant-numeric:tabular-nums}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;font-weight:600;font-size:16px}.brand .glyph{color:var(--cyan);font-size:20px}.brand small{color:var(--muted);font-weight:400}
  .nav{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
  .nav a{color:var(--muted);text-decoration:none;font-size:13px;padding:6px 14px;border-radius:7px}.nav a.on{background:var(--cyan);color:#06222a;font-weight:600}.nav a:not(.on):hover{color:var(--text)}
  .live{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.pulse{width:9px;height:9px;border-radius:50%;background:var(--green)}
  .kpis{display:flex;gap:22px;flex-wrap:wrap}.kpi .l{font-size:11.5px;color:var(--muted)}.kpi .v{font-size:20px;font-weight:600;margin-top:2px}.kpi.red .v{color:var(--red)}
  .stage{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;padding:16px 24px;max-width:1360px;margin:0 auto;transition:grid-template-columns .3s}
  .stage.focus{grid-template-columns:.85fr 1.15fr}@media(max-width:940px){.stage,.stage.focus{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .maphead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px}.maphead h2{font-size:14px;margin:0}
  .legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
  svg{width:100%;height:auto;display:block;transition:opacity .25s}
  .india{fill:#0E1522;stroke:#25324a;stroke-width:1}.lane{fill:none;stroke-width:1.2}
  .nodo{cursor:pointer}.nodo.red{animation:blip 1.8s infinite}@keyframes blip{0%,100%{opacity:1}50%{opacity:.45}}
  @media(prefers-reduced-motion:reduce){.nodo.red{animation:none}}

  .sect{font-size:12px;color:var(--muted);margin:14px 0 8px;font-weight:500}
  .catrow{display:grid;grid-template-columns:120px 1fr 52px;align-items:center;gap:10px;margin-bottom:6px;font-size:12.5px;cursor:pointer;padding:3px 4px;border-radius:6px}
  .catrow:hover{background:var(--panel2)}.catrow.on{background:rgba(52,211,238,.10);outline:1px solid #2c5566}

  table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}td.r,th.r{text-align:right}td.r{font-family:"Space Grotesk";font-variant-numeric:tabular-nums}
  tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
  .po{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}.po .od{color:var(--red);font-weight:600}.po .ok{color:var(--muted)}
  .unitsrow{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px}.unitsrow input{background:var(--panel2);border:1px solid var(--line);color:var(--text);font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;width:110px;font-family:"Space Grotesk"}
  .polrow{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:10px;flex-wrap:wrap}.polrow button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:6px 10px;border-radius:7px;cursor:pointer}.polrow button.on{background:var(--cyan);color:#06222a;font-weight:600}
  .slrow{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12.5px}.slrow input[type=range]{flex:1;accent-color:var(--cyan)}.slrow b{font-family:"Space Grotesk";width:46px;text-align:right}
  .simcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sim{border:1px solid #2c5566;background:linear-gradient(180deg,rgba(52,211,238,.05),transparent);border-radius:12px;padding:12px 14px;margin-top:12px}

  .clearcat{color:var(--cyan);cursor:pointer;font-size:11.5px;margin-left:8px}

  const row=n=>`<div class="a" data-id="${n.id}"><span>${badge(n)} ${n.name.replace(' mother WH',' WH')}</span><span class="num muted">${metric(n)}</span></div>`;
  const attn=nodes.filter(n=>(n.type==="DS"&&n.sev!=="green")||(n.type==="WH"&&n.sev==="amber")).sort((a,b)=>rk[a.sev]-rk[b.sev]||(b.shortfall-a.shortfall));
  const ok=nodes.filter(n=>(n.type==="DS"&&n.sev==="green")||(n.type==="WH"&&n.sev!=="amber")).sort((a,b)=>(b.surplus-a.surplus));
  document.getElementById("side").innerHTML=`<h3>Network overview</h3><div class="sub">All nodes — attention first, tap to drill in</div>
    <div class="sect" style="margin-top:2px">Needs attention · ${attn.length}</div><div class="alerts">${attn.map(row).join("")}</div>
    <div class="sect">Healthy · ${ok.length}</div><div class="alerts">${ok.map(row).join("")}</div>`;
  document.querySelectorAll(".alerts .a").forEach(el=>el.onclick=()=>select(nodes.find(n=>n.id==el.dataset.id)));}
async function select(n){focus=n;selCat=null;simSrc=null;document.getElementById("stage").classList.add("focus");
  const wh=nodes.find(m=>m.type==="WH"&&m.city===WHCITY[n.region]);const near=nearby(n,6);const cluster=[n,...near];if(wh&&!cluster.includes(wh))cluster.push(wh);
  document.getElementById("mapTitle").textContent=`Local network · ${n.city}, ${n.region}`;draw(cluster);
  document.getElementById("side").innerHTML="Loading…";
  if(n.type==="WH"){detail=await j("/api/net/warehouse/"+n.id);renderWH(n);}
  else{detail=await j("/api/net/store/"+n.id);renderDS(n);}}
function renderWH(n){const d=detail;const od=d.pos.filter(p=>p.overdue).length;
  document.getElementById("side").innerHTML=`<button class="backbtn" onclick="overview()">← Back to network</button>
   <h3>${n.name}</h3><div class="sub">Warehouse · ${n.region} region</div><span class="badge ${n.sev==="amber"?"amber":"green"}">${n.sev==="amber"?"Watch":"Healthy"}</span>
   <div class="metrics"><div class="m"><div class="l">On-hand surplus</div><div class="v num">${fmt(d.surplus)}</div></div><div class="m"><div class="l">Cover (days)</div><div class="v num">${d.cover}d</div></div>
     <div class="m"><div class="l">Stores served</div><div class="v num">${fmt(d.served)}</div></div><div class="m"><div class="l">Open POs</div><div class="v num">${d.pos.length}${od?` · <span style="color:var(--red)">${od} late</span>`:""}</div></div></div>
   <div class="flow"><span class="in">Inbound <b>${fmt(d.inb)}</b></span><span class="arrow">→</span><span class="out">Outbound <b>${fmt(d.outb)}</b></span></div>
   <div class="sect">Open purchase orders — supplier status</div>
   ${d.pos.length?d.pos.map(p=>`<div class="po"><span>${p.sup}</span><span class="muted">${fmt(p.units)} units</span><span class="${p.overdue?'od':'ok'}">${p.overdue?'overdue':'on track '+p.expected}</span></div>`).join(""):'<div class="muted" style="font-size:12.5px">No open POs.</div>'}`;}
function renderDS(n){const d=detail;const maxc=Math.max(1,...d.cats.map(c=>c.dpd));
  const cats=d.cats.slice(0,6).map((c,i)=>`<div class="catrow ${i<2?"hot":""} ${selCat===c.cat?"on":""}" data-cat="${c.cat}"><span>${c.cat}</span><div class="cbar"><span style="width:${Math.round(c.dpd/maxc*100)}%"></span></div><b>${c.dpd}/d</b></div>`).join("");
  const prods=selCat?d.prods.filter(p=>p.cat===selCat):d.prods.slice(0,8);
  const ptitle=selCat?`Products in ${selCat} <span class="clearcat" onclick="clearCat()">show all</span>`:"Top products in demand &amp; short";
  document.getElementById("side").innerHTML=`<button class="backbtn" onclick="overview()">← Back to network</button>
    <h3>${n.name}</h3><div class="sub">Dark store · ${n.city}, ${n.region}</div><span class="badge ${n.sev}">${n.sev==="red"?"Critical":n.sev==="amber"?"Watch":"Healthy"}</span>
    <div class="metrics"><div class="m"><div class="l">Categories short</div><div class="v num">${d.cats.length}</div></div><div class="m"><div class="l">Total shortfall</div><div class="v num">${fmt(d.shortfall)}</div></div></div>
    <div class="flow"><span class="in">Inbound <b>${fmt(n.inb)}</b></span><span class="arrow">→</span><span class="out">Outbound <b>${fmt(n.outb)}</b></span></div>
    <div class="sect">Demand by category — tap to see products</div>${cats}
    <div class="sect">${ptitle}</div>
    <table><thead><tr><th>SKU</th><th>Category</th><th class="r">Demand/d</th><th class="r">On hand</th><th class="r">Move</th></tr></thead><tbody>${prods.map(s=>`<tr><td>${s.sku}</td><td class="muted">${s.cat}</td><td class="r">${s.dpd}</td><td class="r">${s.oh}</td><td class="r">${fmt(s.move)}</td></tr>`).join("")}</tbody></table>
    <div class="sect">Sourcing options — cover the shortfall <span class="muted" style="font-weight:400">(5c-2)</span></div>
    <div class="unitsrow"><span class="muted">Units to move</span><input id="unitsIn" type="number" min="0" value="${Math.round(d.shortfall)||100}"></div>
    <table><thead><tr><th>Source</th><th class="r">Distance</th><th class="r">ETA</th><th class="r">Avail</th><th class="r">Transfer cost</th></tr></thead><tbody id="srcBody"></tbody></table>
    <div class="hint" id="srcHint"></div><div id="simWrap"></div>`;
  document.querySelectorAll(".catrow[data-cat]").forEach(el=>el.onclick=()=>{selCat=(selCat===el.dataset.cat)?null:el.dataset.cat;renderDS(n);});
  document.getElementById("unitsIn").oninput=()=>fillSources(n);fillSources(n);}
function fillSources(n){const u=Math.max(0,+document.getElementById("unitsIn").value||0);const SPEED=40;
  const rows=nodes.filter(x=>x.type==="WH").map(w=>{const dd=hav(n.lonlat,w.lonlat);return{w,d:dd,cost:transferCost(u,dd),eta:(dd/SPEED).toFixed(1),ok:w.surplus>=u}}).sort((a,b)=>a.cost-b.cost);
  const rec=rows.find(r=>r.ok);
  document.getElementById("srcBody").innerHTML=rows.map(r=>`<tr class="click" data-src="${r.w.id}"><td>${r.w.name.replace(' mother WH',' WH')} ${rec&&r.w.id===rec.w.id?'<span class="badge green" style="margin-left:6px">Best</span>':''}</td><td class="r">${fmt(r.d)} km</td><td class="r">${r.eta}h</td><td class="r ${r.ok?'':'neg'}">${fmt(r.w.surplus)}</td><td class="r">₹${fmt(r.cost)}</td></tr>`).join("");
  document.querySelectorAll("#srcBody tr[data-src]").forEach(el=>el.onclick=()=>openSim(n,nodes.find(x=>x.id==el.dataset.src)));
  document.getElementById("srcHint").innerHTML=rec?`Cheapest feasible: <b>${rec.w.name.replace(' mother WH',' WH')}</b> — ₹${fmt(rec.cost)} for ${fmt(u)} units. <span class="muted">Tap a source to simulate price impact ↓</span>`:"No single warehouse has enough surplus — split across sources.";
  if(simSrc)openSim(n,nodes.find(x=>x.id==simSrc));}
function econ(n){const U=Math.max(1,+document.getElementById("unitsIn").value||1);const w=nodes.find(x=>x.id==simSrc);const d=hav(n.lonlat,w.lonlat);const T=transferCost(U,d);return{U,w,d,T,t:T/U,p:detail.avg_price,c:detail.avg_cost}}
function openSim(n,w){simSrc=w.id;const wrap=document.getElementById("simWrap");if(!wrap)return;
  wrap.innerHTML=`<div class="sim"><div class="sect" style="margin-top:0">Price-impact simulator · ${w.name.replace(' mother WH',' WH')} → ${n.name} <span class="muted" style="font-weight:400">(5c-3)</span></div>
    <div class="polrow" id="polrow"><button data-p="absorb" class="on">Absorb</button><button data-p="be">Break-even</button><button data-p="rupee">Protect ₹/unit</button><button data-p="pct">Protect % margin</button></div>
    <div class="slrow"><span class="muted">Pass to customer</span><input id="passSl" type="range" min="0" max="150" value="0"><b id="passV">0%</b></div>
    <div class="simcards" id="simCards"></div><div class="hint" id="simRec"></div></div>`;
  document.querySelectorAll("#polrow button").forEach(b=>b.onclick=()=>{[...b.parentNode.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");applyPolicy(n,b.dataset.p);});
  document.getElementById("passSl").oninput=()=>updateSim(n);applyPolicy(n,"absorb");}
function applyPolicy(n,pol){const e=econ(n);let s;if(pol==="absorb")s=0;else if(pol==="rupee")s=1;else if(pol==="pct")s=e.c?e.p/e.c:1;else s=Math.max(0,1-e.U*(e.p-e.c)/e.T);
  document.getElementById("passSl").value=Math.round(Math.min(150,s*100));updateSim(n);}
function updateSim(n){const e=econ(n);const s=(+document.getElementById("passSl").value)/100;document.getElementById("passV").textContent=Math.round(s*100)+"%";
  const baseNet=e.U*(e.p-e.c)-e.T;const priceInc=s*e.t;const newP=e.p+priceInc;const cust=e.p?priceInc/e.p*100:0;const net=e.U*(e.p-e.c)-(1-s)*e.T;
  const stt=net>=0?"green":"red",lbl=net>=0?"Profitable":"Loss";
  document.getElementById("simCards").innerHTML=`
    <div class="m"><div class="l">New price / unit</div><div class="v num">₹${fmt(newP)} <span style="font-size:12px;color:var(--amber)">+${cust.toFixed(1)}%</span></div></div>
    <div class="m"><div class="l">Transfer cost</div><div class="v num">₹${fmt(e.T)}</div></div>
    <div class="m"><div class="l">Net before</div><div class="v num" style="color:${baseNet>=0?'var(--green)':'var(--red)'}">${baseNet<0?'-₹':'₹'}${fmt(Math.abs(baseNet))}</div></div>
    <div class="m"><div class="l">Net after</div><div class="v num" style="color:var(--${stt})">${net<0?'-₹':'₹'}${fmt(Math.abs(net))}</div><div style="margin-top:4px"><span class="badge ${stt}">${lbl}</span></div></div>`;
  const beS=Math.max(0,1-e.U*(e.p-e.c)/e.T);
  document.getElementById("simRec").innerHTML=baseNet>=0?`Already profitable at current price — passing cost is optional upside.`:`At current price this transfer loses <b>₹${fmt(-baseNet)}</b>. Passing ~<b>${Math.round(beS*100)}%</b> of transfer cost (≈ <b>+${(e.p?beS*e.t/e.p*100:0).toFixed(1)}%</b> price) breaks even.`;}
window.clearCat=()=>{selCat=null;renderDS(focus);};
(async function init(){
  const raw=await j("/api/net/nodes");
  nodes=raw.map(n=>({...n,lonlat:placed(n)}));
  document.getElementById("k_nodes").textContent=fmt(nodes.length);
  document.getElementById("k_red").textContent=fmt(nodes.filter(n=>n.type==="DS"&&n.sev==="red").length);
  document.getElementById("k_short").textContent=fmt(nodes.filter(n=>n.type==="DS").reduce((t,n)=>t+n.shortfall,0));
  overview();
})();
</script></body></html>
